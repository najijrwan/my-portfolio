<svg width="40" height="32" viewBox="0 0 40 32" fill="none" xmlns="http://www.w3.org/2000/svg">

<!-- Window frame -->
<rect x="1.5" y="1.5" width="37" height="29" rx="3" stroke="url(#grad)" stroke-width="1.6"/>

<!-- Top bar -->
<circle cx="5.5" cy="5" r="1" fill="url(#grad)"/>
<circle cx="8.5" cy="5" r="1" fill="url(#grad)"/>
<circle cx="11.5" cy="5" r="1" fill="url(#grad)"/>

<rect x="16" y="4" width="18" height="2" rx="1" fill="url(#grad)" opacity="0.6"/>

<!-- Code symbol -->
<path d="M25 11 L22 14 L25 17" stroke="url(#grad)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M30 11 L33 14 L30 17" stroke="url(#grad)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

<!-- Stack layers -->
<polygon points="9,12 14,15 9,18 4,15" stroke="url(#grad)" stroke-width="1.6" fill="none"/>
<polygon points="9,17 14,20 9,23 4,20" stroke="url(#grad)" stroke-width="1.6" fill="none"/>
<polygon points="9,22 14,25 9,28 4,25" stroke="url(#grad)" stroke-width="1.6" fill="none"/>

<!-- User -->
<circle cx="28" cy="23" r="2.5" stroke="url(#grad)" stroke-width="1.6"/>
<path d="M23.5 28C24.5 25.5 27 24.8 28 24.8C29 24.8 31.5 25.5 32.5 28"
stroke="url(#grad)" stroke-width="1.6" stroke-linecap="round"/>

<!-- Gradient -->
<defs>
<linearGradient id="grad" x1="0" y1="0" x2="40" y2="32" gradientUnits="userSpaceOnUse">
<stop offset="0.25" stop-color="#FFDB6E"/>
<stop offset="1" stop-color="#FFBC5E"/>
</linearGradient>
</defs>

</svg>